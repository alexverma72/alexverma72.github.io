<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Babazone PDF Tools</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
  <h4 class="text-white">⚡ Babazone PDF Tools</h4>
</nav>

<!-- MAIN -->
<div class="container text-center mt-5">

  <h2 class="mb-4">Compress PDF File</h2>

  <!-- Upload Box -->
  <div class="upload-box" id="dropArea">
    <p>📂 Drag & Drop your PDF or <span onclick="document.getElementById('fileInput').click()">Browse</span></p>
    <input type="file" id="fileInput" hidden>
    <p id="fileName"></p>
  </div>

  <!-- Button -->
  <button class="btn btn-primary mt-3" onclick="compressPDF()">Compress PDF</button>

  <!-- Loader -->
  <div id="loader" style="display:none;" class="mt-3">
    <div class="spinner-border text-primary"></div>
    <p>Processing...</p>
  </div>

</div>

<!-- FOOTER -->
<footer class="text-center mt-5 p-3 bg-light">
  <a href="about.html">About</a> |
  <a href="privacy.html">Privacy</a> |
  <a href="contact.html">Contact</a>
</footer>

<script src="script.js"></script>

</body>
</html>
