<!DOCTYPE html>
<html>
<head>
  <title>Babazone PDF Machine</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔥 HEADER -->
<div class="header d-flex justify-content-between align-items-center px-4">
  <h2><span class="logo">⚙</span> BABAZONE <span class="red">PDF MACHINE</span></h2>

  <div>
    <button class="lang-btn">English</button>
    <button class="lang-btn">हिन्दी</button>
  </div>
</div>

<!-- 🧰 TOOL BAR -->
<div class="tools-bar text-center mt-3">

  <div class="tool">Merge PDF</div>
  <div class="tool">Split PDF</div>
  <div class="tool">Compress PDF</div>
  <div class="tool">Edit PDF</div>
  <div class="tool">PDF to JPG</div>

</div>

<!-- 📢 AD SPACE -->
<div class="ad-box">Ad Space</div>

<!-- 📂 MAIN TOOL UI -->
<div class="container mt-4">

  <h4>PDF Compress</h4>

  <div class="upload-box">
    <p>⬆ Drag & Drop Your PDF Here or <span class="browse">Browse Files</span></p>
    <input type="file">
  </div>

  <div class="text-center mt-3">
    <button class="btn btn-danger">Compress PDF</button>
  </div>

  <!-- Progress -->
  <div class="progress mt-3">
    <div class="progress-bar bg-danger" style="width: 70%">70%</div>
  </div>

</div>

<!-- 📢 BIG AD -->
<div class="ad-box big">Ad Space</div>

<!-- 🔻 FOOTER -->
<div class="footer text-center">
  About | Privacy Policy | Disclaimer | Contact Us
  <br>
  © 2026 Babazone PDF Machine
</div>

</body>
</html>
